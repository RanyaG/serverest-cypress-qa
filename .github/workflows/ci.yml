name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Todo dia às 09:00 (horário de Brasília): monitora o ambiente público
    - cron: '0 12 * * *'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run lint

  api:
    name: Testes de API (ServeRest local)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Sobe o ServeRest em localhost:3000 e roda os testes de API
        run: npm run test:api:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-api
          path: cypress/reports
          if-no-files-found: ignore

  e2e:
    name: Testes E2E (front.serverest.dev)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-e2e
          path: cypress/reports
          if-no-files-found: ignore
